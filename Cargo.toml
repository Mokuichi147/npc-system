[package]
name = "npc-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rule-based multi-town NPC generation simulation prototype"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.9.5"
rand_chacha = { version = "0.9.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[profile.release]
lto = "thin"

